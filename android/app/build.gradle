apply plugin: 'com.android.application'

android {
    namespace 'com.smallnukem.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.smallnukem.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Sideloaded personal build: signed with the local debug key
            // (AGP's built-in debug signing config / ~/.android/debug.keystore).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
